<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; border-radius:12px; overflow:hidden; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0c1222" />
      <stop offset="100%" stop-color="#05070e" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="radarSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Dynamic Animated LiDAR / Radar System (Right Side Visual) -->
  <g transform="translate(980, 180)">
    <!-- Range Rings -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 6" stroke-opacity="0.25" />
    <circle cx="0" cy="0" r="105" fill="none" stroke="#818cf8" stroke-width="1" stroke-opacity="0.3" />
    <circle cx="0" cy="0" r="70" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="6 4" stroke-opacity="0.35" />
    <circle cx="0" cy="0" r="35" fill="none" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4" />

    <!-- Crosshairs -->
    <line x1="-155" y1="0" x2="155" y2="0" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="3 3"/>
    <line x1="0" y1="-155" x2="0" y2="155" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="3 3"/>

    <!-- Rotating Radar Sweep Cone -->
    <g>
      <path d="M 0 0 L 140 -35 A 140 140 0 0 1 140 35 Z" fill="url(#radarSweep)">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite" />
      </path>
    </g>

    <!-- Simulated LiDAR Point Cloud Cluster & Map Landmarks -->
    <!-- Feature Points with Dynamic Pulsing -->
    <circle cx="45" cy="-60" r="3.5" fill="#38bdf8" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" repeatCount="indefinite" />
    </circle>
    <circle cx="80" cy="-25" r="4" fill="#a855f7" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.7s" repeatCount="indefinite" />
    </circle>
    <circle cx="-50" cy="55" r="3" fill="#38bdf8" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="-75" cy="-45" r="4.5" fill="#4ade80" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="95" cy="40" r="3" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.9s" repeatCount="indefinite" />
    </circle>
    <circle cx="-30" cy="-85" r="3.5" fill="#f43f5e" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.3s" repeatCount="indefinite" />
    </circle>
    <circle cx="20" cy="85" r="3.5" fill="#fbbf24">
      <animate attributeName="opacity" values="0.7;0.1;0.7" dur="2.8s" repeatCount="indefinite" />
    </circle>

    <!-- Center Robot / Sensor Origin -->
    <circle cx="0" cy="0" r="6" fill="#38bdf8" filter="url(#glow)">
      <animate attributeName="r" values="5;7;5" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <polygon points="0,-12 6,4 0,0 -6,4" fill="#ffffff" opacity="0.95" />
  </g>

  <!-- Left Side Dynamic Navigation Trajectory / Factor Graph Flow -->
  <g opacity="0.45">
    <path d="M 40 310 C 120 280, 160 330, 260 290 S 420 260, 500 300" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" values="0;24" dur="2s" repeatCount="indefinite" />
    </path>
    <!-- Keyframe Poses -->
    <circle cx="120" cy="285" r="4.5" fill="#38bdf8" />
    <circle cx="260" cy="290" r="4.5" fill="#818cf8" />
    <circle cx="420" cy="275" r="4.5" fill="#c084fc" />
    <!-- Graph Edge Connections -->
    <line x1="120" y1="285" x2="160" y2="245" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <line x1="260" y1="290" x2="290" y2="240" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="160" cy="245" r="3" fill="#a855f7" />
    <circle cx="290" cy="240" r="3" fill="#38bdf8" />
  </g>

  <!-- Foreground Content Container (Card Protection to ensure pristine readability) -->
  <g transform="translate(60, 42)">
    <!-- Top Category Pill -->
    <g transform="translate(0, 0)">
      <rect width="210" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="14" cy="14" r="5" fill="#10b981">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x="27" y="18" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="1">CURATED ECOSYSTEM</text>
    </g>

    <!-- Main Title (Guaranteed Sharp Foreground) -->
    <text x="0" y="78" fill="url(#primaryGrad)" font-size="40" font-weight="800" letter-spacing="-0.5" filter="url(#softGlow)">
      Awesome SLAM &amp; Navigation Platforms
    </text>
    <text x="0" y="78" fill="url(#primaryGrad)" font-size="40" font-weight="800" letter-spacing="-0.5">
      Awesome SLAM &amp; Navigation Platforms
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="118" fill="#cbd5e1" font-size="17" font-weight="400">
      Simultaneous Localization &amp; Mapping • Autonomous Mobile Robotics • Sensor Fusion
    </text>

    <!-- Descriptive Context -->
    <text x="0" y="148" fill="#94a3b8" font-size="14" font-weight="400">
      The definitive index of production-ready SaaS platforms, commercial SDKs, and state-of-the-art open-source engines.
    </text>

    <!-- Technology Highlights Badges / Chips -->
    <g transform="translate(0, 185)">
      <!-- Chip 1: Visual SLAM -->
      <g transform="translate(0, 0)">
        <rect width="135" height="32" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
        <text x="14" y="20" fill="#38bdf8" font-size="12" font-weight="600">📷 Visual-Inertial</text>
      </g>
      <!-- Chip 2: LiDAR SLAM -->
      <g transform="translate(145, 0)">
        <rect width="130" height="32" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4"/>
        <text x="14" y="20" fill="#818cf8" font-size="12" font-weight="600">📡 LiDAR Odometry</text>
      </g>
      <!-- Chip 3: ROS 2 Nav2 -->
      <g transform="translate(285, 0)">
        <rect width="125" height="32" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4"/>
        <text x="14" y="20" fill="#c084fc" font-size="12" font-weight="600">🤖 ROS 2 &amp; Nav2</text>
      </g>
      <!-- Chip 4: Factor Graphs -->
      <g transform="translate(420, 0)">
        <rect width="135" height="32" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1" stroke-opacity="0.4"/>
        <text x="14" y="20" fill="#34d399" font-size="12" font-weight="600">⚡ Factor Graphs</text>
      </g>
      <!-- Chip 5: Spatial AI -->
      <g transform="translate(565, 0)">
        <rect width="125" height="32" rx="8" fill="#0f172a" stroke="#f472b6" stroke-width="1" stroke-opacity="0.4"/>
        <text x="14" y="20" fill="#f472b6" font-size="12" font-weight="600">🌐 Spatial AI</text>
      </g>
    </g>
  </g>

  <!-- Sleek Accent Bottom Border -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#primaryGrad)" />
</svg>
